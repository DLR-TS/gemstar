[ue_esmini_feature]
;Debug=true
Parameters="Resources/simple-left-turn/scenario_scenario1_0.xosc"

[ue_vehicle_feature]
Input=[ue_esmini_feature]
;Debug=true
;later TypeMapping shall be a json or csv file
VehicleDataConfiguration="VehicleDataConfig.json"
SensorPlatform_1=ego
SensorPlatform_2=other
StaticSensorPlatform=GEMSTAR_Root
VehicleMappingLog=true
VehicleMappingFileName=GEMSTAR_vehicle_mapping.csv
ClearAbandonedVehicles=true

[ue_camera_feature:sensor1]
;Debug=true
Mount=SensorPlatform_1
MountingPositionX=70
MountingPositionY=0
MountingPositionZ=160
MountingOrientationRoll=0
MountingOrientationPitch=0
MountingOrientationYaw=0
Width=1920
Height=1080
FoVHorizontal=90
FoVVertical=90

[ue_lidar_feature:sensor1]
;Debug=true
Mount=SensorPlatform_1
MountingPositionX=260
MountingPositionY=0
MountingPositionZ=70
MountingOrientationRoll=0
MountingOrientationPitch=0
MountingOrientationYaw=0
NumberOfRaysHorizontal=200
NumberOfRaysVertical=10
FoVHorizontal=180
FoVVertical=20
Range=100
;NoFalloff=true
DistanceHalfFalloff=60

[ue_lidar_feature:sensor2]
;Debug=true
Mount=SensorPlatform_1
MountingPositionX=-260
MountingPositionY=0
MountingPositionZ=70
MountingOrientationRoll=0
MountingOrientationPitch=0
MountingOrientationYaw=180
NumberOfRaysHorizontal=200
NumberOfRaysVertical=10
FoVHorizontal=180
FoVVertical=20
Range=100
;NoFalloff=true
DistanceHalfFalloff=60

[ue_visualizer_feature]
;Debug=true
Input=[ue_lidar_feature:sensor1, ue_lidar_feature:sensor2]

[ue_logger_feature]
;Debug=true
GroundTruth=true
;Input=[ue_camera_feature:sensor1, ue_lidar_feature:sensor1]
FileName=GEMSTAR